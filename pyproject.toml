[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miniserve-lab"
version = "0.1.0"
description = "Explicit KV caching and continuous batching for a small CPU Transformer."
requires-python = ">=3.11"
dependencies = ["torch>=2.8,<3", "numpy>=1.26,<3", "fastapi>=0.143,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13,<3", "ruff>=0.12"]

[project.scripts]
miniserve = "miniserve.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
