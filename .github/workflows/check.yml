name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python scripts/verify_cache.py --output /tmp/cache.json
      - run: python scripts/verify_http.py --output /tmp/http.json
